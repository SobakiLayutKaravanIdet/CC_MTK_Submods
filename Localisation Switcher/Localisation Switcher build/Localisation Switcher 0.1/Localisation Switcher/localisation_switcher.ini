; Change the language identifier assigned to each of the game's 13 CSV translation slots.
; The selected identifier is written as `language = <id>` in the game settings.txt.
; Identifiers may be custom (for example l_old_russian); use only letters, digits and underscores.
; Duplicate identifiers select the first matching slot.
[slots]
slot_1 = l_english
slot_2 = l_russian
slot_3 = l_remove_kebab
slot_4 = l_polish
slot_5 = l_spanish
slot_6 = l_italian
slot_7 = l_swedish
slot_8 = l_czech
slot_9 = l_hungarian
slot_10 = l_dutch
slot_11 = l_portugese
slot_12 = l_french
slot_13 = l_german
